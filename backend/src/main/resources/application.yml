server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: campusguard-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusguard_db}
    username: ${SPRING_DATASOURCE_USERNAME:campusguard_user}
    password: ${SPRING_DATASOURCE_PASSWORD:HawassaSecurity2026!}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

campusguard:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlX2hhd2Fzc2FfdW5pdmVyc2l0eV9jYW1wdXNndWFyZF9qd3Rfc2VjcmV0X2tleV8yMDI2}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
